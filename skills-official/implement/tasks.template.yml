  - id: task-3
    goal: "Refactor user service for better maintainability"
    description: "Extract business logic from controllers, improve error handling"
    status: pending
    priority: medium
    type: refactor
    effort: 6h
    
    docs:
      - "docs/architecture.md#Service-Layer"
      - "docs/standards.md#Code-Quality"
    
