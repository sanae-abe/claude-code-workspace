      - "JWT token issued on successful login"
      - "Token refresh endpoint working"
      - "Logout invalidates token"
      - "Protected routes return 401 for invalid tokens"
    
    # Dependencies
    depends_on: []
    
    # Metadata (auto-filled during execution)
    started_at: null
    completed_at: null
    assigned_to: null
    blocked_reason: null
    git_branch: null
    git_commit: null

  # Example 2: Test task
  - id: task-2
    goal: "Write unit tests for authentication"
    description: "Achieve 90%+ test coverage for auth module"
    status: pending
    priority: high
    type: test
    effort: 4h
    
    docs:
      - "docs/testing.md#Unit-Test-Standards"
      - "docs/design.md#Authentication"
    
    acceptance_criteria:
